<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Letter Match">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<title>Owlery Letter Match</title>
</head>
<body>
<script src="../lib/three.min.js"></script>
<script src="../lib/common.js"></script>
<script>
(() => {
  const { rand, clamp, lerp } = HP;
  const { renderer, scene, camera } = HP.setup({ fogColor: 0x1d1640, fogNear: 60, fogFar: 200, fov: 45, onResize: fitCamera });
  const sky = HP.makeSky(scene, { moonPos: new THREE.Vector3(70, 40, -300), bottom: 0x8a4a9a, mid: 0x2b1d6b, stars: 1400 });
  const fx = new HP.Particles(scene, 900);
  const input = HP.input();
  let matches = 0, playing = false;
  const ui = HP.ui({
    title: 'Owlery Letter Match', icon: '💌', hint: '👆 💌 💌',
    onStart() { playing = true; HP.sfx.hoot(); HP.sfx.music(true); },
  });

  /* ---- owlery room: wooden table, stone floor, arch, floating candles ---- */
  const table = new THREE.Mesh(new THREE.BoxGeometry(30, 0.8, 22), new THREE.MeshStandardMaterial({ color: 0x4a2a14, roughness: 0.9 }));
  table.position.set(0, -0.4, -2);
  scene.add(table);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(31, 0.6, 23), new THREE.MeshStandardMaterial({ color: 0x2e1a0c, roughness: 0.9 }));
  rim.position.set(0, -0.9, -2);
  scene.add(rim);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x2c2645, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -8;
  const castle = HP.makeCastle();
  castle.position.set(0, -40, -170);
  castle.scale.setScalar(2.4);
  scene.add(castle);

  // owlery back wall with a big arched window looking out at the castle
  const brickTex = HP.canvasTex(256, (g, S) => {
    g.fillStyle = '#4b4470'; g.fillRect(0, 0, S, S);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 5; c++) {
      const off = r % 2 ? 26 : 0, sh = 60 + Math.floor(Math.random() * 25);
      g.fillStyle = `rgb(${sh + 10},${sh},${sh + 45})`;
      g.fillRect(c * 52 - off + 2, r * 32 + 2, 48, 28);
    }
  });
  brickTex.wrapS = brickTex.wrapT = THREE.RepeatWrapping;
  brickTex.repeat.set(0.08, 0.08);
  const wallShape = new THREE.Shape();
  wallShape.moveTo(-80, -60); wallShape.lineTo(80, -60); wallShape.lineTo(80, 60); wallShape.lineTo(-80, 60); wallShape.lineTo(-80, -60);
  const hole = new THREE.Path();
  hole.moveTo(-11, 2); hole.lineTo(11, 2); hole.lineTo(11, 12); hole.absarc(0, 12, 11, 0, Math.PI, false); hole.lineTo(-11, 2);
  wallShape.holes.push(hole);
  const wall = new THREE.Mesh(new THREE.ShapeGeometry(wallShape), new THREE.MeshLambertMaterial({ map: brickTex, color: 0xbbb0ff }));
  wall.position.z = -13;
  scene.add(wall);
  const sill = new THREE.Mesh(new THREE.BoxGeometry(24, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x5a5280 }));
  sill.position.set(0, 1.8, -12.6);
  scene.add(sill);
  // perch beam for the owls
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 30, 12), new THREE.MeshStandardMaterial({ color: 0x5c3b1e, roughness: 0.9 }));
  beam.rotation.z = Math.PI / 2;
  beam.position.set(0, 6.2, -9);
  scene.add(beam);
  const candles = [];
  for (let i = 0; i < 14; i++) {
    const c = new THREE.Group();
    const wax = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, rand(1, 1.8), 10), new THREE.MeshStandardMaterial({ color: 0xfff3dc, emissive: 0x3a3020 }));
    c.add(wax);
    const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: HP.glowTex, color: 0xffb347, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    flame.scale.set(1.4, 2, 1);
    flame.position.y = 1.1;
    c.add(flame);
    c.position.set(rand(-22, 22), rand(10, 16), rand(-22, -6));
    c.userData.p = rand(0, 6);
    c.userData.y = c.position.y;
    c.userData.flame = flame;
    scene.add(c);
    candles.push(c);
  }
  const owls = [HP.makeOwl('hedwig'), HP.makeOwl('pig')];
  const perches = [new THREE.Vector3(-4.5, 7.4, -9), new THREE.Vector3(4.5, 6.9, -9)];
  owls[0].scale.setScalar(1.1); owls[1].scale.setScalar(0.7);
  owls.forEach((o, i) => { o.position.copy(perches[i]); scene.add(o); o.userData.state = 'perch'; o.userData.wiggle = 0; });

  /* ---- card faces drawn with canvas (no fonts / no reading needed) ---- */
  const S = 256;
  function face(bg, draw) {
    return HP.canvasTex(S, (g) => {
      g.fillStyle = '#fff8e6'; g.fillRect(0, 0, S, S);
      g.fillStyle = bg; roundRect(g, 14, 14, S - 28, S - 28, 26); g.fill();
      g.lineWidth = 8; g.strokeStyle = '#ffd76a'; roundRect(g, 14, 14, S - 28, S - 28, 26); g.stroke();
      g.save(); g.translate(S / 2, S / 2); draw(g); g.restore();
    });
  }
  function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function star(g, r1, r2, n = 5) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? r2 : r1; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); }
  const symbols = [
    face('#2f4fb0', (g) => { // lightning bolt
      g.fillStyle = '#ffd23f'; g.strokeStyle = '#7a3b00'; g.lineWidth = 6;
      g.beginPath(); g.moveTo(15, -85); g.lineTo(-45, 10); g.lineTo(-5, 10); g.lineTo(-25, 85); g.lineTo(45, -15); g.lineTo(5, -15); g.lineTo(25, -85); g.closePath(); g.fill(); g.stroke();
    }),
    face('#7a2d8f', (g) => { star(g, 80, 34); g.fillStyle = '#ffe14d'; g.fill(); g.lineWidth = 6; g.strokeStyle = '#b8860b'; g.stroke(); }),
    face('#1d2a5a', (g) => { // moon
      g.fillStyle = '#fff1a8'; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#1d2a5a'; g.beginPath(); g.arc(32, -18, 62, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; star(g, 12, 5); g.translate(45, 45); g.fill();
    }),
    face('#ffb3c7', (g) => { // heart
      g.fillStyle = '#e8304a'; g.beginPath(); g.moveTo(0, 70); g.bezierCurveTo(-110, 0, -60, -90, 0, -40); g.bezierCurveTo(60, -90, 110, 0, 0, 70); g.fill();
      g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.arc(-35, -25, 12, 0, 7); g.fill();
    }),
    face('#2e7d4f', (g) => { // snitch
      g.fillStyle = '#fff6d8'; g.strokeStyle = '#c9a227'; g.lineWidth = 4;
      [-1, 1].forEach((s) => { g.beginPath(); g.ellipse(s * 62, -10, 55, 20, s * -0.3, 0, Math.PI * 2); g.fill(); g.stroke(); });
      g.fillStyle = '#ffc928'; g.beginPath(); g.arc(0, 0, 34, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#a67c00'; g.lineWidth = 5; g.stroke();
      g.fillStyle = '#fff3b0'; g.beginPath(); g.arc(-10, -10, 9, 0, 7); g.fill();
    }),
    face('#3b2a6a', (g) => { // wizard hat
      g.fillStyle = '#6b4bd8'; g.beginPath(); g.moveTo(-20, -85); g.quadraticCurveTo(30, -60, 50, 50); g.lineTo(-50, 50); g.quadraticCurveTo(-40, -20, -20, -85); g.fill();
      g.fillStyle = '#4a2fa8'; g.beginPath(); g.ellipse(0, 55, 90, 20, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffd23f'; star(g, 16, 7); g.save(); g.translate(5, -5); g.fill(); g.restore();
      g.fillStyle = '#ffd23f'; g.fillRect(-48, 30, 96, 12);
    }),
    face('#b5272d', (g) => { // wand with sparkles
      g.rotate(-0.7); g.fillStyle = '#5c3b1e'; g.fillRect(-10, -80, 20, 160); g.fillStyle = '#fff'; g.fillRect(-10, -80, 20, 22);
      g.rotate(0.7); g.fillStyle = '#ffe14d';
      [[-55, -60, 20], [-75, -20, 12], [-25, -85, 12]].forEach(([x, y, r]) => { g.save(); g.translate(x, y); star(g, r, r * 0.4, 4); g.fill(); g.restore(); });
    }),
    face('#1f6f8b', (g) => { // owl face
      g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(0, 10, 75, 70, 0, 0, Math.PI * 2); g.fill();
      [-1, 1].forEach((s) => { g.fillStyle = '#ffd21f'; g.beginPath(); g.arc(s * 30, 0, 24, 0, 7); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(s * 30, 0, 12, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 30 + 5, -5, 4, 0, 7); g.fill(); });
      g.fillStyle = '#333'; g.beginPath(); g.moveTo(-8, 25); g.lineTo(8, 25); g.lineTo(0, 42); g.fill();
    }),
  ];
  const backTex = HP.canvasTex(S, (g) => { // envelope back
    g.fillStyle = '#fff8e6'; g.fillRect(0, 0, S, S);
    g.fillStyle = '#f2dfae'; roundRect(g, 12, 12, S - 24, S - 24, 24); g.fill();
    g.strokeStyle = '#d6b979'; g.lineWidth = 6; g.beginPath(); g.moveTo(20, 40); g.lineTo(S / 2, S * 0.6); g.lineTo(S - 20, 40); g.stroke();
    g.fillStyle = '#c0262d'; g.beginPath(); g.arc(S / 2, S * 0.6, 34, 0, 7); g.fill();
    g.fillStyle = '#e8545a'; g.beginPath(); g.arc(S / 2 - 8, S * 0.6 - 8, 10, 0, 7); g.fill();
    g.strokeStyle = '#ffd76a'; g.lineWidth = 8; roundRect(g, 12, 12, S - 24, S - 24, 24); g.stroke();
  });
  const edgeM = new THREE.MeshBasicMaterial({ color: 0xc9a86a });
  const backM = new THREE.MeshBasicMaterial({ map: backTex });
  const faceMs = symbols.map((t) => new THREE.MeshBasicMaterial({ map: t }));

  /* ---- levels ---- */
  const LEVELS = [[3, 2], [4, 2], [4, 3], [4, 4]]; // columns x rows
  let level = 0;
  let cards = [], open = [], busy = false, cursor = 0;
  const cardW = 3.2, cardD = 3.2, gap = 0.7;
  const cardGeo = new THREE.BoxGeometry(cardW, 0.18, cardD);
  const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.6, 40), new THREE.MeshBasicMaterial({ color: 0xffd76a, transparent: true, opacity: 0.0 }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.05;
  scene.add(ring);
  let keyboardUsed = false;

  function deal() {
    cards.forEach((c) => scene.remove(c));
    cards = []; open = []; busy = false; cursor = 0;
    const [cols, rows] = LEVELS[Math.min(level, LEVELS.length - 1)];
    const n = cols * rows;
    const pick = symbols.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, n / 2);
    const deck = pick.concat(pick).sort(() => Math.random() - 0.5);
    deck.forEach((sym, i) => {
      // box face order: +x,-x,+y(top = envelope back),-y(bottom = picture),+z,-z
      const m = new THREE.Mesh(cardGeo, [edgeM, edgeM, backM, faceMs[sym], edgeM, edgeM]);
      const c = i % cols, r = Math.floor(i / cols);
      const x = (c - (cols - 1) / 2) * (cardW + gap), z = (r - (rows - 1) / 2) * (cardD + gap);
      m.userData = { sym, flip: 0, target: 0, home: new THREE.Vector3(x, 0.1, z), done: false, shake: 0, idx: i };
      m.position.set(x, 8 + i * 0.4, z); // drop in from above
      m.rotation.y = rand(-0.3, 0.3);
      scene.add(m);
      cards.push(m);
    });
    fitCamera();
    HP.sfx.whoosh();
  }
  function fitCamera() {
    const [cols, rows] = LEVELS[Math.min(level, LEVELS.length - 1)];
    const w = cols * (cardW + gap), d = rows * (cardD + gap);
    const aspect = window.innerWidth / window.innerHeight;
    const vfov = (camera.fov * Math.PI) / 180;
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    const needW = (w * 0.5 + 1) / Math.tan(hfov / 2);
    const needD = (d * 0.5 + 7.5) / Math.tan(vfov / 2);
    const dist = Math.max(needW, needD) * 1.05;
    camera.position.set(0, dist * 0.58, dist * 0.82);
    camera.lookAt(0, 3.2, -2.5);
  }

  function flip(card) {
    const u = card.userData;
    if (busy || u.done || u.target === 1 || !playing) return;
    u.target = 1;
    HP.sfx.flip();
    open.push(card);
    if (open.length === 2) {
      busy = true;
      const [a, b] = open;
      if (a.userData.sym === b.userData.sym) {
        setTimeout(() => {
          HP.sfx.chime(); HP.sfx.sparkle();
          [a, b].forEach((c) => fx.burst(c.position.clone().setY(1), [0xffd34d, 0xffffff, 0xff9ad5], 30, 6, 0.7));
          a.userData.done = b.userData.done = true;
          matches++;
          ui.setScore(matches);
          sendOwl([a, b]);
          open = []; busy = false;
        }, 450);
      } else {
        setTimeout(() => {
          HP.sfx.soft();
          owls.forEach((o) => (o.userData.wiggle = 1));
          a.userData.shake = b.userData.shake = 0.4;
        }, 700);
        setTimeout(() => { a.userData.target = b.userData.target = 0; open = []; busy = false; }, 1200);
      }
    }
  }

  // an owl swoops down, grabs the matching letters and flies them off
  let nextOwl = 0;
  function sendOwl(pair) {
    let o = owls[nextOwl % 2];
    if (o.userData.state !== 'perch') o = owls[(nextOwl + 1) % 2];
    nextOwl++;
    if (o.userData.state !== 'perch') { // both busy: cards just float away in sparkles
      pair.forEach((c) => (c.userData.floatAway = 1));
      return;
    }
    o.userData.kind === 'pig' ? HP.sfx.tweet() : HP.sfx.hoot();
    const mid = pair[0].userData.home.clone().add(pair[1].userData.home).multiplyScalar(0.5);
    o.userData.state = 'fly';
    o.userData.path = { t: 0, from: o.position.clone(), to: mid.clone().setY(2.5), pair, phase: 'down' };
  }
  function updateOwl(o, i, dt, t) {
    const u = o.userData, p = u.path;
    if (u.state === 'perch') {
      o.position.lerp(perches[i], dt * 3);
      o.rotation.set(0, Math.sin(t * 0.5 + i) * 0.2, 0);
      // look at the open card
      const look = open[open.length - 1];
      u.head.rotation.y = look ? clamp((look.position.x - o.position.x) * 0.08, -0.7, 0.7) : Math.sin(t * 0.7 + i * 2) * 0.4;
      if (u.wiggle > 0) { u.wiggle -= dt; u.head.rotation.z = Math.sin(u.wiggle * 18) * 0.35; } else u.head.rotation.z = 0;
      HP.animateOwl(o, dt, t, 0, 3);
      return;
    }
    HP.animateOwl(o, dt, t, 1, u.kind === 'pig' ? 6 : 3);
    p.t += dt;
    if (p.phase === 'down') {
      const k = Math.min(1, p.t / 0.9), e = k * k * (3 - 2 * k);
      o.position.lerpVectors(p.from, p.to, e);
      o.position.y += Math.sin(k * Math.PI) * 2;
      o.rotation.x = 0.4 * (1 - k);
      if (k >= 1) { p.phase = 'grab'; p.t = 0; }
    } else if (p.phase === 'grab') {
      p.pair.forEach((c, j) => { c.position.lerp(o.position.clone().add(new THREE.Vector3(j ? 0.8 : -0.8, -1.4, 0.3)), dt * 8); c.rotation.x = lerp(c.rotation.x, 0.3, dt * 5); });
      if (p.t > 0.5) { p.phase = 'away'; p.t = 0; p.from = o.position.clone(); p.to = new THREE.Vector3((i ? 1 : -1) * 34, 18, -14); HP.sfx.whoosh(); }
    } else if (p.phase === 'away') {
      const k = Math.min(1, p.t / 1.6);
      o.position.lerpVectors(p.from, p.to, k * k);
      o.rotation.y = (i ? -1 : 1) * -0.9;
      p.pair.forEach((c, j) => c.position.copy(o.position).add(new THREE.Vector3(j ? 0.8 : -0.8, -1.4, 0.3)));
      if (Math.random() < 0.7) fx.trail(o.position, 0xfff2b0, 0.6);
      if (k >= 1) {
        p.pair.forEach((c) => { scene.remove(c); c.visible = false; });
        p.phase = 'home'; p.t = 0; p.from = o.position.clone();
        checkLevelDone();
      }
    } else if (p.phase === 'home') {
      const k = Math.min(1, p.t / 1.4);
      o.position.lerpVectors(p.from, perches[i], k * (2 - k));
      o.rotation.y = 0;
      if (k >= 1) u.state = 'perch';
    }
  }
  function checkLevelDone() {
    if (cards.every((c) => c.userData.done) && !checkLevelDone.pending) {
      checkLevelDone.pending = true;
      setTimeout(() => {
        HP.sfx.fanfare();
        ui.banner('🎉🦉🎉');
        fx.fireworks(new THREE.Vector3(0, 6, -4), 10, 8);
        setTimeout(() => { level = level + 1 >= LEVELS.length ? LEVELS.length - 1 : level + 1; deal(); checkLevelDone.pending = false; }, 2600);
      }, 300);
    }
  }

  /* ---- input: tap/click cards, or arrows + Enter/Space ---- */
  const ray = new THREE.Raycaster();
  window.addEventListener('pointerdown', (e) => {
    if (!ui.started() || !input.pointer) return;
    ray.setFromCamera({ x: input.pointer.x, y: input.pointer.y }, camera);
    const hit = ray.intersectObjects(cards.filter((c) => !c.userData.done), false)[0];
    if (hit) { flip(hit.object); cursor = hit.object.userData.idx; return; }
    const oh = owls.find((o) => ray.intersectObject(o, true).length);
    if (oh) { oh.userData.kind === 'pig' ? HP.sfx.tweet() : HP.sfx.hoot(); oh.userData.wiggle = 0.6; }
  });
  window.addEventListener('keydown', (e) => {
    if (!ui.started()) return;
    const [cols] = LEVELS[Math.min(level, LEVELS.length - 1)];
    const k = e.key;
    const move = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols, a: -1, d: 1, w: -cols, s: cols }[k];
    if (move !== undefined) { keyboardUsed = true; cursor = clamp(cursor + move, 0, cards.length - 1); HP.sfx.pop(); }
    if ((k === 'Enter' || k === ' ') && cards[cursor]) { keyboardUsed = true; flip(cards[cursor]); }
  });

  const clock = new THREE.Clock();
  let t = 0;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;
    sky.update(t);
    cards.forEach((c, i) => {
      const u = c.userData;
      if (u.done) {
        if (u.floatAway) { c.position.y += dt * 6; c.rotation.y += dt * 4; u.floatAway -= dt; if (u.floatAway <= 0 && c.parent) { scene.remove(c); checkLevelDone(); } }
        return;
      }
      c.position.lerp(u.home, dt * 6);
      c.rotation.y = lerp(c.rotation.y, 0, dt * 6);
      u.flip = lerp(u.flip, u.target, dt * 10);
      c.rotation.z = u.flip * Math.PI;
      c.position.y = u.home.y + Math.sin(u.flip * Math.PI) * 1.2 + (c.position.y - u.home.y) * 0.9;
      if (u.shake > 0) { u.shake -= dt; c.position.x = u.home.x + Math.sin(u.shake * 50) * 0.15; }
    });
    const cur = cards[cursor];
    ring.material.opacity = keyboardUsed && cur && !cur.userData.done ? 0.6 + 0.3 * Math.sin(t * 6) : 0;
    if (cur) ring.position.set(cur.userData.home.x, 0.05, cur.userData.home.z);
    owls.forEach((o, i) => updateOwl(o, i, dt, t));
    candles.forEach((c) => { c.position.y = c.userData.y + Math.sin(t + c.userData.p) * 0.4; c.userData.flame.material.opacity = 0.75 + 0.25 * Math.sin(t * 13 + c.userData.p); });
    fx.update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  deal();
  window.__game = { get matches() { return matches; }, cards, flip, camera, get level() { return level; } };
  frame();
})();
</script>
</body>
</html>
