<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הוגוורטס HD">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../lib/fonts.css">
<title>הוגוורטס HD – עולם קסום</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:#fff;
    font-family:'Rubik','Arial Hebrew','Heebo',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* quiet glass-and-gold HUD; minimal Hebrew text so the world is the hero */
  .pill{position:fixed;padding:4px 14px;border-radius:22px;background:rgba(30,20,70,.6);
    border:2px solid rgba(255,215,106,.7);color:#ffe9a8;font-size:20px;font-weight:bold;z-index:10;
    text-shadow:0 2px 0 #000;pointer-events:none;top:calc(10px + env(safe-area-inset-top))}
  #fps{right:calc(12px + env(safe-area-inset-right))}
  #tier{right:calc(100px + env(safe-area-inset-right))}
  #backend{left:calc(12px + env(safe-area-inset-left))}
  #time{left:50%;transform:translateX(-50%)}
  /* FPS / backend / quality read-outs are for grown-ups: shown only with ?debug=1 */
  body:not(.debug) #fps,body:not(.debug) #tier,body:not(.debug) #backend{display:none}
  body:not(.debug) #quest{top:calc(10px + env(safe-area-inset-top))}
  body:not(.debug) #bellBtn{top:calc(14px + env(safe-area-inset-top)) !important}
  .gamebtn{position:fixed;width:84px;height:84px;border-radius:50%;border:4px solid #ffd76a;
    background:rgba(40,25,90,.72);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;
    z-index:11;box-shadow:0 4px 14px rgba(0,0,0,.4);touch-action:none}
  .gamebtn:active{transform:scale(.9)}
  #timeBtn{left:calc(18px + env(safe-area-inset-left));bottom:calc(32px + env(safe-area-inset-bottom))}
  /* on-screen camera controls (rotate / zoom / reset) — a tidy cluster, iPad-friendly */
  #camctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));
    display:flex;gap:10px;z-index:11}
  .cambtn{width:62px;height:62px;border-radius:50%;border:3px solid #ffd76a;
    background:rgba(40,25,90,.6);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.35);touch-action:none;-webkit-user-select:none;user-select:none}
  .cambtn:active{transform:scale(.9);background:rgba(60,40,120,.8)}
  #joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;
    border:4px solid rgba(255,215,106,.75);background:radial-gradient(circle,rgba(60,40,120,.35),rgba(40,25,90,.15));
    z-index:9;pointer-events:none;opacity:0;transition:opacity .12s}
  #joy.on{opacity:1}
  #joyKnob{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#ffe9a8,#ffb020);border:3px solid #fff;
    box-shadow:0 0 18px rgba(255,210,90,.8);z-index:9;pointer-events:none;opacity:0;transition:opacity .12s}
  #joyKnob.on{opacity:1}
  #load{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#2b1d6b,#05060d);font-size:30px;color:#ffd76a}
  #load.hide{display:none}
  #err{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);display:none;z-index:50;
    background:rgba(60,10,10,.9);border:3px solid #ff8a8a;border-radius:16px;padding:18px 22px;max-width:80vw;font-size:22px}
  /* quest HUD: stars + letters, under the FPS/tier row */
  #quest{position:fixed;top:calc(52px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    display:flex;gap:8px;z-index:10}
  #quest .q{padding:3px 12px;border-radius:20px;background:rgba(30,20,70,.6);border:2px solid rgba(255,215,106,.7);
    color:#ffe9a8;font-size:19px;font-weight:bold;text-shadow:0 2px 0 #000}
  /* round action buttons on the right-bottom: map + mute */
  #mapBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(32px + env(safe-area-inset-bottom))}
  #muteBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(128px + env(safe-area-inset-bottom))}
  #exitBtn{right:calc(18px + env(safe-area-inset-right));top:calc(100px + env(safe-area-inset-top));display:none}
  /* "enter the castle" prompt — a wide gold pill that appears near the front oak doors */
  #enterBtn{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:none;align-items:center;gap:8px;padding:12px 26px;border-radius:26px;border:4px solid #ffd76a;
    background:rgba(40,25,90,.82);color:#ffe9a8;font-size:24px;font-weight:bold;z-index:13;cursor:pointer;
    text-shadow:0 2px 0 #000;box-shadow:0 4px 16px rgba(0,0,0,.5);animation:enterPulse 1.4s ease-in-out infinite}
  #enterBtn:active{transform:translateX(-50%) scale(.94)}
  @keyframes enterPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.5)}50%{box-shadow:0 0 22px 4px rgba(255,210,90,.6)}}
  /* speech bubble shown when near a friend */
  #bubble{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
    max-width:min(560px,86vw);padding:12px 20px;border-radius:20px;background:rgba(28,18,66,.92);
    border:3px solid #ffd76a;color:#fff;font-size:22px;text-align:center;z-index:12;display:none;
    box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #bubble b{color:#ffe08a;display:block;font-size:17px;margin-bottom:2px}
  /* toast for quest progress */
  #toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);opacity:0;transition:all .3s;
    padding:12px 24px;border-radius:18px;background:rgba(40,25,90,.95);border:3px solid #ffd76a;
    color:#ffe9a8;font-size:24px;font-weight:bold;z-index:30;pointer-events:none;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  /* map / fast-travel overlay (built by map.js) */
  #map{position:fixed;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 35%,rgba(43,29,107,.97),rgba(5,6,13,.98));
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  #map.on{display:flex}
  /* candle-lit vignette indoors: darker screen edges so the warm light pools glow */
  #vig{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(18,8,30,.34) 78%,rgba(8,3,18,.66) 100%)}
  body.inside #vig{opacity:1}
  #map h2{color:#ffd76a;font-size:30px;margin:0;text-shadow:0 2px 0 #000}
  #map .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
    width:min(760px,90vw);max-height:62vh;overflow:auto;padding:4px}
  #map .dest{padding:16px 10px;border-radius:18px;border:3px solid #ffd76a;cursor:pointer;
    background:rgba(40,25,90,.7);color:#fff;font-size:20px;font-weight:bold;text-align:center;
    display:flex;flex-direction:column;gap:6px;align-items:center}
  #map .dest:active{transform:scale(.95)}
  #map .dest .ico{font-size:40px}
  #map .close{padding:10px 30px;border-radius:22px;border:3px solid #ffd76a;background:rgba(60,40,120,.8);
    color:#ffe9a8;font-size:22px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vig"></div>
<div id="load">✨ טוען את הטירה… ✨</div>
<div id="fps" class="pill">— FPS</div>
<div id="tier" class="pill">—</div>
<div id="backend" class="pill">—</div>
<div id="time" class="pill">☀️ יום</div>
<button id="timeBtn" class="gamebtn" aria-label="שעה ביום">🌓</button>
<button id="mapBtn" class="gamebtn" aria-label="מפה">🗺️</button>
<button id="muteBtn" class="gamebtn" aria-label="צליל">🔊</button>
<button id="exitBtn" class="gamebtn" aria-label="יציאה">🚪</button>
<button id="enterBtn" aria-label="היכנס לטירה">🚪 היכנס לטירה</button>
<div id="quest">
  <div class="q" id="stars">⭐ 0</div>
  <div class="q" id="letters">💌 0</div>
</div>
<div id="bubble"></div>
<div id="toast"></div>
<div id="map"></div>
<div id="camctl">
  <button id="camL" class="cambtn" aria-label="סובב שמאלה">⟲</button>
  <button id="camOut" class="cambtn" aria-label="התרחק">➖</button>
  <button id="camReset" class="cambtn" aria-label="איפוס מצלמה">🎯</button>
  <button id="camIn" class="cambtn" aria-label="התקרב">➕</button>
  <button id="camR" class="cambtn" aria-label="סובב ימינה">⟳</button>
</div>
<div id="joy"></div>
<div id="joyKnob"></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.webgpu.js",
    "three/webgpu": "./lib/three.webgpu.js",
    "three/tsl": "./lib/three.tsl.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
<script>
  if (/[?&]debug=1/.test(location.search)) document.body.classList.add('debug');
  // block pinch / double-tap zoom so little fingers don't get lost
  ['gesturestart','gesturechange','gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  // hide loader once the game signals ready (polled; keeps HTML dependency-free)
  const li = setInterval(() => {
    if (window.__game) { clearInterval(li); const l = document.getElementById('load'); if (l) l.classList.add('hide'); }
  }, 150);
</script>
<!-- The lesson mini-games + professor overlay + progress store are v1's own files (one source
     of truth, shared progress). src/lessons.js gives them a place in the HD world. -->
<script>window.__hd = true;</script>
<script src="../hogwarts-explorer/lessons/progress.js"></script>
<script src="../hogwarts-explorer/lessons/teacher.js"></script>
<script src="../hogwarts-explorer/lessons/overlay.js"></script>
<script src="../hogwarts-explorer/lessons/potions.js"></script>
<script src="../hogwarts-explorer/lessons/charms.js"></script>
<script src="../hogwarts-explorer/lessons/herbology.js"></script>
<script src="../hogwarts-explorer/lessons/spells.js"></script>
<script src="../hogwarts-explorer/lessons/transfiguration.js"></script>
<script src="../hogwarts-explorer/lessons/astronomy.js"></script>
<script src="../hogwarts-explorer/lessons/creatures.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
